[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqcx"
version = "0.1.0"
description = "What can the readout see? Reachability, Lie algebras and performance of variational quantum classifiers."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vqcx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
